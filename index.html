<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= SEO TITLE ================= -->
    <title>
      United Movement Company | Ground Handling & Airport Services | مجموعة الحركة المتحدة
    </title>

    <!-- ================= SEO DESCRIPTION ================= -->
    <meta
      name="description"
      content="United Movement Company is a leading provider of ground handling and airport services in Saudi Arabia and the Middle East, offering baggage handling, passenger services, and logistics support. | مجموعة الحركة المتحدة شركة رائدة في خدمات المناولة الأرضية وحلول المطارات في السعودية والشرق الأوسط."
    />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f172a" />

    <!-- ================= CANONICAL ================= -->
    <link rel="canonical" href="https://co.umcgc.com/" />

    <!-- ================= FAVICON ================= -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ================= OPEN GRAPH ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="United Movement Company" />
    <meta property="og:url" content="https://co.umcgc.com/" />

    <meta
      property="og:title"
      content="United Movement Company | Ground Handling & Airport Services"
    />

    <meta
      property="og:description"
      content="Airport and ground handling services in Saudi Arabia | خدمات المناولة الأرضية وحلول المطارات"
    />

    <meta property="og:image" content="https://co.umcgc.com/logo.png" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- ================= TWITTER CARD ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="United Movement Company | Airport & Ground Handling Services"
    />
    <meta
      name="twitter:description"
      content="Integrated airport and logistics services in Saudi Arabia."
    />
    <meta name="twitter:image" content="https://co.umcgc.com/logo.png" />

    <!-- ================= LANGUAGE / i18n SEO ================= -->
    <meta name="google" content="notranslate" />

    <!-- مهم: اعتماد hreflang الصحيح -->
    <link rel="alternate" hreflang="en" href="https://co.umcgc.com/en" />
    <link rel="alternate" hreflang="ar" href="https://co.umcgc.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://co.umcgc.com/" />

    <!-- ================= STRUCTURED DATA (SEO POWER BOOST) ================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "United Movement Company | مجموعة الحركة المتحدة",
        "alternateName": "United Movement Company",
        "url": "https://co.umcgc.com/",
        "logo": "https://co.umcgc.com/logo.png",
        "description": "Ground handling and airport services provider in Saudi Arabia and the Middle East.",
        "areaServed": "Saudi Arabia",
        "knowsLanguage": ["en", "ar"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["English", "Arabic"]
        },
        "sameAs": [
          "https://x.com/companymovement",
          "https://www.instagram.com/umcc_group/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
